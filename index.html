<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KayaKnow</title>
<meta name="description" content="A simple offline budget app for life in Hong Kong. No sign-up. Your data stays on your phone.">
<link rel="icon" href="icon.png">
<style>
  :root{--ink:#16283B;--dim:#5E7286;--bg:#FFF8EE;--card:#fff;--line:#EADCC8}
  @media (prefers-color-scheme: dark){:root{--ink:#F3EEE6;--dim:#A9B4C0;--bg:#121A24;--card:#1B2633;--line:#2C3A4A}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans TC",sans-serif}
  main{max-width:640px;margin:0 auto;padding:56px 16px;text-align:center}
  img{width:96px;height:96px;border-radius:22%}
  h1{font-size:40px;margin:16px 0 4px}h1 span{color:#E23E86}
  .tag{font-size:20px;margin:0 0 24px}
  ul{list-style:none;padding:0;margin:0 auto 32px;display:grid;gap:8px;max-width:420px;text-align:left}
  li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
  .btn{display:inline-block;background:linear-gradient(155deg,#F7A52B,#E8602A);color:#fff;font-weight:700;text-decoration:none;border-radius:999px;padding:14px 28px}
  footer{margin-top:40px;color:var(--dim);font-size:14px}
  footer a{color:inherit}
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="KayaKnow icon">
  <h1>Kaya<span>Know</span></h1>
  <p class="tag">A simple budget app for life in Hong Kong.</p>
  <ul>
    <li>💸 Split your pay before you spend it</li>
    <li>🧾 Bill reminders before the due date</li>
    <li>💳 See the month you’ll be debt-free</li>
    <li>🔒 Offline, no sign-up, data stays on your phone</li>
  </ul>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.ironfuture.kayaknow">Get it on Google Play</a>
  <footer>Iron Future, Hong Kong · <a href="privacy.html">Privacy Policy</a> · <a href="mailto:SUPPORT_EMAIL">Contact</a></footer>
</main>
</body>
</html>
